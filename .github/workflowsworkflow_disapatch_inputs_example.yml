name: Manual Workflow with Number Input

on:
  workflow_dispatch:
    inputs:
      myNumberInput:
        description: 'Enter a number for processing'
        required: true
        type: number
        default: 100 # Optional: A default value for the input

jobs:
  process_number:
    runs-on: ubuntu-latest
    steps:
      - name: Use the number input
        run: |
          echo "The number entered was: ${{ inputs.myNumberInput }}"
          echo "Double the number: $(( inputs.myNumberInput * 2 ))"
